<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Gear Teeth -->
  <rect x="6" y="0" width="4" height="2" fill="#808080"/>
  <rect x="6" y="14" width="4" height="2" fill="#808080"/>
  <rect x="0" y="6" width="2" height="4" fill="#808080"/>
  <rect x="14" y="6" width="2" height="4" fill="#808080"/>
  
  <rect x="2" y="2" width="2" height="2" fill="#808080"/>
  <rect x="12" y="2" width="2" height="2" fill="#808080"/>
  <rect x="2" y="12" width="2" height="2" fill="#808080"/>
  <rect x="12" y="12" width="2" height="2" fill="#808080"/>

  <!-- Gear Body -->
  <rect x="4" y="2" width="8" height="12" fill="#c0c0c0"/>
  <rect x="2" y="4" width="12" height="8" fill="#c0c0c0"/>
  
  <rect x="5" y="3" width="6" height="10" fill="#c0c0c0"/>
  <rect x="3" y="5" width="10" height="6" fill="#c0c0c0"/>
  
  <!-- Inner hole -->
  <rect x="6" y="6" width="4" height="4" fill="#000"/>
  <rect x="7" y="7" width="2" height="2" fill="#fff"/>
  
  <!-- Highlights and shadows for 3D effect -->
  <rect x="4" y="3" width="8" height="1" fill="#fff"/>
  <rect x="3" y="4" width="1" height="8" fill="#fff"/>
  
  <rect x="4" y="12" width="8" height="1" fill="#808080"/>
  <rect x="12" y="4" width="1" height="8" fill="#808080"/>
</svg>
