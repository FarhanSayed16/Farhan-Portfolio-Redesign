<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0d1117" />
  
  <!-- Subtle Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Center Icon/Text -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="-20" r="40" fill="rgba(239, 68, 68, 0.1)" stroke="#ef4444" stroke-width="2" />
    <path d="M -15 -20 L 15 -20 M 0 -35 L 0 -5" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    
    <text x="0" y="50" font-family="monospace" font-size="24" fill="#64748b" text-anchor="middle" font-weight="bold" letter-spacing="2">ECOSWEEP</text>
    <text x="0" y="80" font-family="monospace" font-size="14" fill="#475569" text-anchor="middle" letter-spacing="1">PROJECT ASSET PENDING</text>
  </g>
</svg>
